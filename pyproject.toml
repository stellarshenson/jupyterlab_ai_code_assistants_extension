[build-system]
requires = ["hatchling>=1.5.0", "hatch-nodejs-version>=0.3.2", "jupyter-builder>=1.2.0,<2"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab_ai_code_assistants_extension"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jupyter_server>=2.21.0,<3",
    # The DeepSeek Harness stores every conversation log as concatenated
    # Zstandard frames (its default; a raw-text root is opt-in), so listing
    # its sessions means decoding them here. 0.13 is the first release whose
    # stream reader crosses frame boundaries.
    "zstandard>=0.25.0,<1",
    # Spawns the terminal a Launcher tile launches into (ACC-LNCH-154). The
    # coupling is the command id string basic-terminal:launch, not a token, so
    # there is no npm dependency to match this one (ACC-LNCH-159).
    "jupyterlab-basic-terminal-extension>=1.0.7,<2",
    # Companion labextension providing the IColourfulTabs token. Declared as a
    # non-bundled webpack singleton (package.json sharedPackages), so it must be
    # present at runtime or the whole extension fails to load with "Shared
    # module @stellarshenson/jupyterlab-colourful-tab-extension doesn't exist in
    # shared scope". 1.1.28 is the first release that registers the module under
    # that scoped npm name, so a companion below it fails the same way; its
    # Python distribution name did not change. The ownership API this extension
    # depends on - claim() and the colourChanged signal - and the server route
    # reporting each terminal's pty incarnation first shipped in 1.1.20.
    "jupyterlab_colourful_tab_extension>=1.1.28,<2",
    # The move-to-trash half of every destructive action. jupyter_server pulls
    # it in transitively today, but a delete that promised the user a
    # recoverable outcome must not depend on somebody else's dependency graph.
    "send2trash>=2.1.0,<3",
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.scripts]
jupyterlab-ai-code-assistants = "jupyterlab_ai_code_assistants_extension.cli:main"

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.6.0,<5",
    "jupyter-builder>=1.2.0,<2",
]
test = [
    "coverage>=7.17.0,<8",
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "pytest-jupyter[server]>=0.11.0,<1"
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["jupyterlab_ai_code_assistants_extension/labextension"]
exclude = [".github", "binder", ".claude", "logs", "docs/defects.md"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlab_ai_code_assistants_extension/labextension" = "share/jupyter/labextensions/@stellarshenson/jupyterlab-ai-code-assistants-extension"
"install.json" = "share/jupyter/labextensions/@stellarshenson/jupyterlab-ai-code-assistants-extension/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"
".agents/skills/jupyterlab-ai-code-assistants-extension" = "share/jupyter/agents/skills/jupyterlab-ai-code-assistants-extension"

[tool.hatch.build.hooks.version]
path = "jupyterlab_ai_code_assistants_extension/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyterlab_ai_code_assistants_extension/labextension/static/style.js",
    "jupyterlab_ai_code_assistants_extension/labextension/package.json",
]
skip-if-exists = ["jupyterlab_ai_code_assistants_extension/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyterlab_ai_code_assistants_extension/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyter-builder>=1.2.0,<2'",
    "jlpm",
    "jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]
